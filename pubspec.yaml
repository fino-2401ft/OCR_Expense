name: ocr_expense_tracker
description: "OCR expense tracker with on-device ML Kit receipt parsing and CustomPainter charts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.2
  google_mlkit_text_recognition: ^0.15.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  image: ^4.5.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
